<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/dashboard-systems-teamwork.css" />
</head>

<body class="dashboard-systems-teamwork-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    >
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu...</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app dashboard-systems-teamwork-app">
    <div class="content dashboard-systems-teamwork-content">
        <header class="topbar dashboard-systems-teamwork-topbar">
            <section class="panel meta topbar-meta" aria-label="Header metadata">
                <div class="topbar-meta-content">
                    <div class="topbar-meta-lines">
                        <div class="meta-line">Customer Name: <strong id="customerName">-</strong></div>
                        <div class="meta-line">Project Name: <strong id="projectName">-</strong></div>
                        <div class="meta-line">User Name: <strong id="userName">-</strong></div>
                    </div>

                    <div class="topbar-logo">
                        <img src="../images/EIS-logo.png" alt="EIS logo" class="eis-logo" />
                    </div>
                </div>
            </section>

            <section class="panel status-panel topbar-status-panel" aria-label="Load status">
                <div class="meta-line">Data: <strong id="loadStatus">Idle</strong></div>
            </section>
        </header>

        <section class="panel page-layout dashboard-systems-teamwork-layout" aria-label="Systems teamwork dashboard">
            <div class="section-header dashboard-systems-teamwork-section-header">
                <h2 id="dashboardSystemsTeamworkTitle">Systems Teamwork</h2>

                <div class="dashboard-systems-teamwork-filter-bar" aria-label="Systems teamwork filters">
                    <div class="dashboard-systems-teamwork-filter-group">
                        <div class="dashboard-systems-teamwork-filter-slot">
                            <span class="dashboard-systems-teamwork-filter-slot-label">TRL</span>
                            <div id="dashboardSystemsTeamworkFilterTrl" class="dashboard-systems-teamwork-filter-zone" data-filter-type="trl" tabindex="0" role="region" aria-label="Drop TRL values here"></div>
                        </div>

                        <div class="dashboard-systems-teamwork-filter-slot">
                            <span class="dashboard-systems-teamwork-filter-slot-label">System Owner</span>
                            <div id="dashboardSystemsTeamworkFilterOwner" class="dashboard-systems-teamwork-filter-zone" data-filter-type="owner" tabindex="0" role="region" aria-label="Drop System Owner values here"></div>
                        </div>

                        <div class="dashboard-systems-teamwork-filter-slot">
                            <span class="dashboard-systems-teamwork-filter-slot-label">Department</span>
                            <div id="dashboardSystemsTeamworkFilterDepartment" class="dashboard-systems-teamwork-filter-zone" data-filter-type="department" tabindex="0" role="region" aria-label="Drop Department values here"></div>
                        </div>
                    </div>
                </div>

                <div class="section-header-actions dashboard-systems-teamwork-actions" aria-label="Page actions">
                    <button
                            id="btnDownloadPdf"
                            class="dashboard-systems-teamwork-icon-button dashboard-systems-teamwork-pdf-button"
                            type="button"
                            aria-label="Download dashboard as PDF"
                            title="Download dashboard as PDF"
                    >
                        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                            <path d="M8 3.5h11.5L25 9v19.5H8V3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                            <path d="M19.5 3.5V9H25" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                            <rect x="6" y="15" width="20" height="9" rx="1.6" fill="currentColor"></rect>
                            <text x="16" y="21.7" text-anchor="middle" font-size="6.4" font-weight="800" fill="rgb(15,23,42)">PDF</text>
                        </svg>
                    </button>

                    <button
                            id="btnHelp"
                            class="dashboard-systems-teamwork-icon-button dashboard-systems-teamwork-help-button"
                            type="button"
                            data-help-page="dashboard-systems-teamwork"
                            data-help-title="Help - Systems Teamwork"
                            title="Open help"
                            aria-label="Open help for Systems Teamwork"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18.2A8.2 8.2 0 1 1 12 3.8a8.2 8.2 0 0 1 0 16.4z"></path>
                            <path d="M12 16.75a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3z"></path>
                            <path d="M12.05 5.25c-2.05 0-3.55 1.25-3.8 3.15a.95.95 0 0 0 1.88.25c.13-.96.84-1.55 1.87-1.55 1.13 0 1.9.67 1.9 1.65 0 .82-.42 1.24-1.32 1.88-1.12.8-1.78 1.48-1.78 3.02v.45a.95.95 0 1 0 1.9 0v-.45c0-.68.22-.94 1-1.5 1.04-.74 2.1-1.54 2.1-3.4 0-2.03-1.56-3.5-3.75-3.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="page-body dashboard-systems-teamwork-body">
                <div class="dashboard-systems-teamwork-frame" aria-label="Systems teamwork table frame">
                    <div class="dashboard-systems-teamwork-table-scroll" id="dashboardSystemsTeamworkTableScroll">
                        <div class="dashboard-systems-teamwork-header" id="dashboardSystemsTeamworkHeader" aria-hidden="true"></div>
                        <table class="dashboard-systems-teamwork-table" aria-label="Systems teamwork">
                            <colgroup id="dashboardSystemsTeamworkColGroup"></colgroup>
                            <tbody id="dashboardSystemsTeamworkTableBody"></tbody>
                        </table>

                        <div class="dashboard-systems-teamwork-empty is-visible" id="dashboardSystemsTeamworkEmptyState">
                            Loading systems teamwork...
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"></path>
                </svg>
            </button>
        </div>
        <div id="helpDialogContent" class="help-dialog-content"></div>
        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/dashboard-systems-teamwork-page.js"></script>
</body>
</html>
