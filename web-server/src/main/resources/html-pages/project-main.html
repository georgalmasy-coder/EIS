<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/project-main.css" />
</head>

<body class="project-main-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    &#8250;
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu...</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app project-main-app">
    <div class="content project-main-content">
        <header class="topbar project-main-topbar">
            <section class="panel meta topbar-meta" aria-label="Header metadata">
                <div class="topbar-meta-content">
                    <div class="topbar-meta-lines">
                        <div class="meta-line">Customer Name: <strong id="customerName">—</strong></div>
                        <div class="meta-line">Project Name: <strong id="projectName">—</strong></div>
                        <div class="meta-line">User Name: <strong id="userName">—</strong></div>
                    </div>

                    <div class="topbar-logo">
                        <img src="../images/EIS-logo.png" alt="EIS logo" class="eis-logo" />
                    </div>
                </div>
            </section>

            <section class="panel status-panel topbar-status-panel" aria-label="Load status">
                <div class="meta-line">Data: <strong id="loadStatus">Idle</strong></div>
            </section>
        </header>

        <section class="page-layout project-main-layout" aria-label="Projects">
            <div class="project-main-header-row">
                <div class="workspace-header project-workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow project-workspace-eyebrow"></div>
                    <div id="pageHeading" class="workspace-heading project-workspace-heading"></div>
                    <div id="pageHelpText" class="workspace-helptext project-workspace-helptext"></div>
                </div>

                <div class="project-main-header-actions" role="group" aria-label="View actions">
                    <button
                            id="btnAddProject"
                            class="project-main-icon-button"
                            type="button"
                            aria-label="Create project"
                            title="Create project"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="project-main-toolbar" aria-label="Project toolbar">
                <div class="project-main-filter-group">
                    <label class="project-main-search-filter" for="filterProjectText">
                        <span class="project-main-filter-label">Search</span>
                        <span class="project-main-search-box">
                            <input
                                    id="filterProjectText"
                                    class="project-main-search-input"
                                    type="search"
                                    placeholder="Search in project fields..."
                                    autocomplete="off"
                                    aria-label="Search in project fields"
                            >
                            <button id="btnClearFilter" class="project-main-search-clear" type="button" aria-label="Clear filter" title="Clear filter" hidden>
                                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"></path>
                                </svg>
                            </button>
                            <span class="project-main-search-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                                    <path d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 4.9 14.3l4.4 4.4 1.4-1.4-4.4-4.4A8 8 0 0 0 10 2z"></path>
                                </svg>
                            </span>
                        </span>
                    </label>
                </div>

                <div class="project-main-action-group" aria-label="View actions"></div>
            </div>

            <div class="page-body project-main-body">
                <div class="table-frame page-frame has-table-footer project-main-list-frame" aria-label="Project list frame">
                    <div class="table-scroll project-main-list-scroll" id="tableScroll">
                        <table class="data-table page-table project-main-table" aria-label="Project list">
                            <colgroup id="mainColGroup"></colgroup>
                            <thead>
                            <tr id="mainHeaderRow"></tr>
                            </thead>
                            <tbody id="tbody"></tbody>
                        </table>

                        <div class="empty page-empty project-main-empty" id="listEmptyState">
                            Loading projects...
                        </div>
                    </div>

                    <div class="data-table-footer project-main-table-footer" aria-live="polite">
                        <span class="data-table-footer-count" id="projectTableCount">0 of 0</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                &times;
            </button>
        </div>

        <div id="helpDialogContent" class="help-dialog-content">
            Loading helpÃ¢â‚¬Â¦
        </div>

        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/project-main-page.js"></script>
</body>
</html>
