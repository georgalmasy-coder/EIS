<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/baseline.css" />
</head>

<body class="baseline-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    ›
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu…</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app baseline-app">
    <div class="content baseline-content">
        <header class="topbar baseline-topbar">
            <section class="panel meta topbar-meta" aria-label="Header metadata">
                <div class="topbar-meta-content">
                    <div class="topbar-meta-lines">
                        <div class="meta-line">Customer Name: <strong id="customerName">—</strong></div>
                        <div class="meta-line">Project Name: <strong id="projectName">—</strong></div>
                        <div class="meta-line">User Name: <strong id="userName">—</strong></div>
                    </div>

                    <div class="topbar-logo">
                        <img src="../images/EIS-logo.png" alt="EIS logo" class="eis-logo" />
                    </div>
                </div>
            </section>

            <section class="panel status-panel topbar-status-panel" aria-label="Load status">
                <div class="meta-line">Data: <strong id="loadStatus">Idle</strong></div>
            </section>
        </header>

        <section class="panel page-layout baseline-layout" aria-label="List Of Baselines">
            <div class="section-header baseline-section-header">
                <div>
                    <h2>Baselines</h2>
                    <!--
                    <p class="baseline-section-subtitle">
                        Create and view immutable baselines for the selected customer and project.
                    </p>
                    -->
                </div>

                <div class="section-header-actions baseline-toolbar">
                    <button
                            id="btnAddBaseline"
                            class="page-icon-button baseline-icon-button baseline-add-button"
                            type="button"
                            aria-label="Add new baseline"
                            title="Add new baseline"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"></path>
                        </svg>
                    </button>

                    <button
                            id="btnHelp"
                            class="baseline-icon-button baseline-help-button"
                            type="button"
                            data-help-page="baseline-main"
                            data-help-title="Help - Baselines"
                            title="Open help"
                            aria-label="Open help for Baselines"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18.2A8.2 8.2 0 1 1 12 3.8a8.2 8.2 0 0 1 0 16.4z"></path>
                            <path d="M12 16.75a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3z"></path>
                            <path d="M12.05 5.25c-2.05 0-3.55 1.25-3.8 3.15a.95.95 0 0 0 1.88.25c.13-.96.84-1.55 1.87-1.55 1.13 0 1.9.67 1.9 1.65 0 .82-.42 1.24-1.32 1.88-1.12.8-1.78 1.48-1.78 3.02v.45a.95.95 0 1 0 1.9 0v-.45c0-.68.22-.94 1-1.5 1.04-.74 2.1-1.54 2.1-3.4 0-2.03-1.56-3.5-3.75-3.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!--
                        <div class="baseline-info-bar" aria-label="Baseline information">
                            <div class="baseline-info-item">
                                <span class="baseline-info-label">Baselines:</span>
                                <strong id="baselineCount">—</strong>
                            </div>

                            <div class="baseline-info-item">
                                <span class="baseline-info-label">Hint:</span>
                                <strong>Double click på en baseline to open details</strong>
                            </div>
                        </div>
            -->

            <div class="page-body baseline-body">
                <div class="table-frame page-frame baseline-frame" aria-label="Baseline list frame">
                    <div class="table-scroll baseline-scroll" id="tableScroll">
                        <table class="data-table page-table baseline-table" aria-label="Baseline list">
                            <colgroup id="baselineColGroup">
                                <col data-col-key="tagName" />
                                <col data-col-key="description" />
                                <col data-col-key="changedBy" />
                                <col data-col-key="changedDateTime" />
                            </colgroup>
                            <thead>
                            <tr id="baselineHeaderRow">
                                <th data-key="tagName">
                                    <span class="sort">Tag Name <span class="sort-indicator" id="si-tagName"></span></span>
                                </th>
                                <th data-key="description">
                                    <span class="sort">Description <span class="sort-indicator" id="si-description"></span></span>
                                </th>
                                <th data-key="changedBy">
                                    <span class="sort">Created By <span class="sort-indicator" id="si-changedBy"></span></span>
                                </th>
                                <th data-key="changedDateTime">
                                    <span class="sort">Created At <span class="sort-indicator" id="si-changedDateTime"></span></span>
                                </th>
                            </tr>
                            </thead>
                            <tbody id="baselineBody"></tbody>
                        </table>

                        <div class="empty page-empty baseline-empty" id="baselineEmpty">
                            Loading baselines…
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<dialog id="baselineDialog" class="baseline-dialog" aria-label="Add new baseline dialog">
    <form id="baselineForm" method="dialog" class="dlg baseline-form">
        <div class="page-dialog-head baseline-dialog-head">
            <h3>Add new baseline</h3>
        </div>

        <div class="page-dialog-status baseline-dialog-status" id="baselineDialogStatus">Idle</div>

        <div class="baseline-field-grid">
            <label class="baseline-field-wide">
                <span>Tag Name</span>
                <input
                        id="fieldTagName"
                        type="text"
                        maxlength="150"
                        required
                        autocomplete="off"
                        placeholder="Example: Release-1.0"
                />
            </label>

            <label class="baseline-field-wide">
                <span>Baseline description</span>
                <textarea
                        id="fieldDescription"
                        rows="7"
                        required
                        placeholder="Describe the purpose of this baseline..."
                ></textarea>
            </label>
        </div>

        <div class="dlg-footer baseline-dialog-footer">
            <button id="btnSaveBaseline" class="primary baseline-primary-button" type="button">Save</button>
            <button id="btnCancelBaseline" class="baseline-secondary-button" type="button">Cancel</button>
        </div>
    </form>
</dialog>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                ×
            </button>
        </div>

        <div id="helpDialogContent" class="help-dialog-content">
            Loading help…
        </div>

        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/baseline-main-page.js"></script>
</body>
</html>
