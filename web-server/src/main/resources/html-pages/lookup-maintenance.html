<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/lookup-maintenance.css" />
</head>

<body class="lookup-maintenance-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    &#8250;
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu...</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app lookup-maintenance-app">
    <div class="content lookup-maintenance-content">
        <header class="topbar lookup-maintenance-topbar">
            </header>

        <section class="page-layout lookup-maintenance-layout" aria-label="Lookup maintenance">
            <div class="lookup-maintenance-header-row">
                <div class="workspace-header lookup-maintenance-workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow"></div>
                    <div id="pageHeading" class="workspace-heading"></div>
                    <div id="pageHelpText" class="workspace-helptext"></div>
                </div>
            </div>

            <div class="page-body lookup-maintenance-body">
                <div class="table-frame page-frame lookup-maintenance-frame">
                    <div class="page-tab-bar lookup-maintenance-tab-bar" role="tablist" aria-label="Lookup tables">
                        <button id="trlTabButton" class="tab-btn page-tab-btn" type="button" role="tab" aria-selected="true" aria-controls="trlPanel">TRL</button>
                        <button id="irlTabButton" class="tab-btn page-tab-btn" type="button" role="tab" aria-selected="false" aria-controls="irlPanel">IRL</button>
                        <button id="srlTabButton" class="tab-btn page-tab-btn" type="button" role="tab" aria-selected="false" aria-controls="srlPanel">SRL</button>
                        <button id="classificationTabButton" class="tab-btn page-tab-btn" type="button" role="tab" aria-selected="false" aria-controls="classificationPanel">Classification</button>
                    </div>

                    <div class="table-scroll lookup-maintenance-scroll">
                        <div class="tab-panels lookup-maintenance-panels">
                            <section id="trlPanel" class="tab-panel lookup-maintenance-panel" role="tabpanel" aria-labelledby="trlTabButton">
                                <div id="trlCards" class="lookup-maintenance-card-grid" aria-label="TRL rows"></div>
                            </section>

                            <section id="irlPanel" class="tab-panel lookup-maintenance-panel" role="tabpanel" aria-labelledby="irlTabButton" hidden>
                                <div id="irlCards" class="lookup-maintenance-card-grid" aria-label="IRL rows"></div>
                            </section>

                            <section id="srlPanel" class="tab-panel lookup-maintenance-panel" role="tabpanel" aria-labelledby="srlTabButton" hidden>
                                <div id="srlCards" class="lookup-maintenance-card-grid" aria-label="SRL rows"></div>
                            </section>

                            <section id="classificationPanel" class="tab-panel lookup-maintenance-panel" role="tabpanel" aria-labelledby="classificationTabButton" hidden>
                                <div class="lookup-maintenance-classification-toolbar">
                                    <button id="btnAddClassification" class="lookup-maintenance-icon-button" type="button" aria-label="Create classification" title="Create classification">
                                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                            <path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"></path>
                                        </svg>
                                    </button>
                                </div>
                                <div class="table-frame page-frame has-table-footer lookup-maintenance-table-frame" aria-label="Classification list frame">
                                    <div class="table-scroll lookup-maintenance-table-scroll">
                                        <table class="data-table page-table lookup-maintenance-table" aria-label="Classification list">
                                            <colgroup>
                                                <col style="width: 10%;">
                                                <col style="width: 25%;">
                                                <col style="width: 25%;">
                                                <col style="width: 30%;">
                                                <col style="width: 10%;">
                                            </colgroup>
                                            <thead><tr><th>Code</th><th>Intended purpose / Definition of subclass</th><th>Examples of terms describing or examples of components</th><th>Examples of typical components</th><th>Active</th></tr></thead>
                                            <tbody id="classificationTableBody"></tbody>
                                        </table>
                                        <div id="classificationEmptyState" class="empty page-empty lookup-maintenance-empty" hidden></div>
                                    </div>
                                    <div class="data-table-footer lookup-maintenance-table-footer" aria-live="polite">
                                        <span id="classificationTableCount" class="data-table-footer-count">0 of 0</span>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<dialog id="lookupDialog" class="lookup-maintenance-dialog" aria-labelledby="lookupDialogTitle">
    <form id="lookupForm" method="dialog" class="lookup-maintenance-dialog-form">
        <div class="page-dialog-head lookup-maintenance-dialog-head">
            <div class="lookup-maintenance-dialog-title-group">
                <h3 id="lookupDialogTitle">Lookup</h3>
            </div>
        </div>

        <div class="lookup-maintenance-dialog-grid">
            <input type="hidden" id="lookupTypeInput" />
            <input type="hidden" id="lookupIdInput" />
            <input type="hidden" id="lookupBadgeTextInput" />
            <input type="hidden" id="lookupColorValueInput" />

            <div class="page-field lookup-maintenance-wide-field lookup-maintenance-code-field" id="lookupPreviewField">
                <label id="lookupPreviewLabel">Code / level</label>
                <span id="lookupPreviewChip" class="lookup-maintenance-preview-chip lookup-maintenance-preview-chip-dialog">Value</span>
            </div>

            <div class="page-field lookup-maintenance-wide-field" id="lookupCodeField" hidden>
                <label for="lookupCodeInput" id="lookupCodeLabel">Code</label>
                <input id="lookupCodeInput" type="text" maxlength="2" autocomplete="off" />
            </div>

            <div class="page-field lookup-maintenance-wide-field" id="lookupNameField">
                <label for="lookupNameInput">Name <span aria-hidden="true">*</span></label>
                <input id="lookupNameInput" type="text" maxlength="255" autocomplete="off" required />
            </div>

            <div class="page-field lookup-maintenance-wide-field" id="lookupDescriptionField">
                <label for="lookupDescriptionInput" id="lookupDescriptionLabel">Description <span aria-hidden="true">*</span></label>
                <textarea id="lookupDescriptionInput" rows="5" maxlength="4000" required></textarea>
            </div>

            <div class="page-field lookup-maintenance-wide-field" id="lookupExampleField" hidden>
                <label for="lookupExampleInput" id="lookupExampleLabel">Example</label>
                <textarea id="lookupExampleInput" rows="4"></textarea>
            </div>

            <div class="page-field lookup-maintenance-wide-field" id="lookupUsageExampleField" hidden>
                <label for="lookupUsageExampleInput" id="lookupUsageExampleLabel">Usage Example</label>
                <textarea id="lookupUsageExampleInput" rows="4"></textarea>
            </div>

            <div class="page-field checkbox-field lookup-maintenance-checkbox-field" id="lookupActiveField">
                <input id="lookupActiveInput" type="checkbox" checked />
                <label for="lookupActiveInput">Active</label>
            </div>

            <div class="page-field lookup-maintenance-wide-field" id="lookupColorField">
                <label for="lookupColorPresetSelect">Color</label>
                <div class="lookup-maintenance-color-grid">
                    <select id="lookupColorPresetSelect" class="lookup-maintenance-color-select">
                        <option value="silver">Silver</option>
                        <option value="red">Red</option>
                        <option value="green">Green</option>
                        <option value="blue">Blue</option>
                        <option value="yellow">Yellow</option>
                        <option value="orange">Orange</option>
                        <option value="purple">Purple</option>
                        <option value="pink">Pink</option>
                        <option value="brown">Brown</option>
                        <option value="navy">Navy</option>
                        <option value="teal">Teal</option>
                    </select>

                    <input id="lookupColorInput" class="lookup-maintenance-color-picker" type="color" value="#0000FF" />
                </div>
            </div>
        </div>

        <div class="dlg-footer lookup-maintenance-dialog-footer">
            <button id="lookupSaveBtn" class="primary" type="button">Save</button>
            <button id="lookupCancelBtn" type="button">Cancel</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/lookup-maintenance-page.js"></script>
</body>
</html>
