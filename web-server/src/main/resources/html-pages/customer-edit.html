<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Company Profile</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/customer-edit.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.2/build/css/intlTelInput.css" />
</head>

<body class="customer-edit-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    &#8250;
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu...</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app customer-edit-app">
    <div class="content customer-edit-content">
        <header class="topbar customer-edit-topbar">
            </header>

        <section class="page-layout customer-edit-layout" aria-label="Customer edit">
            <div class="customer-edit-header-row">
                <div class="workspace-header customer-edit-workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow customer-workspace-eyebrow"></div>
                    <div id="pageHeading" class="workspace-heading customer-workspace-heading"></div>
                    <div id="pageHelpText" class="workspace-helptext customer-workspace-helptext"></div>
                </div>
            </div>

            <div id="readOnlyBanner" class="customer-readonly-banner" hidden>
                Historical version is opened in read-only mode. Save and change actions are disabled.
            </div>

            <div class="page-tab-bar customer-edit-tab-bar" role="tablist" aria-label="Customer tabs">
                <button class="tab-btn page-tab-btn is-active" id="tabBtn1" type="button" role="tab" aria-selected="true" aria-controls="tabPanel1">Basis Info</button>
                <button class="tab-btn page-tab-btn" id="tabBtn2" type="button" role="tab" aria-selected="false" aria-controls="tabPanel2">Security</button>
                <button class="tab-btn page-tab-btn" id="tabBtn3" type="button" role="tab" aria-selected="false" aria-controls="tabPanel3">Subscription</button>
                <button class="tab-btn page-tab-btn" id="tabBtn4" type="button" role="tab" aria-selected="false" aria-controls="tabPanel4">Payment Method</button>
                <button class="tab-btn page-tab-btn" id="tabBtn5" type="button" role="tab" aria-selected="false" aria-controls="tabPanel5">Payments</button>
            </div>

            <div class="tab-panels page-dialog-panels customer-edit-panels">
                <section class="tab-panel is-active" id="tabPanel1" role="tabpanel" aria-labelledby="tabBtn1">
                    <div id="basisInfoFields" class="page-field-grid customer-basis-info-fields"></div>
                </section>

                <section class="tab-panel" id="tabPanel2" role="tabpanel" aria-labelledby="tabBtn2">
                    <div id="securityFields" class="page-field-grid customer-security-fields"></div>
                </section>

                <section class="tab-panel" id="tabPanel3" role="tabpanel" aria-labelledby="tabBtn3">
                    <div id="subscriptionFields" class="page-field-grid customer-subscription-fields"></div>

                    <h3 class="customer-subsection-title">Available Plans</h3>
                    <div id="availablePlansFields" class="page-field-grid customer-subscription-fields"></div>
                </section>

                <section class="tab-panel" id="tabPanel4" role="tabpanel" aria-labelledby="tabBtn4">
                    <div id="paymentMethodFields" class="page-field-grid customer-payment-method-fields"></div>
                </section>

                <section class="tab-panel" id="tabPanel5" role="tabpanel" aria-labelledby="tabBtn5">
                    <h3 class="customer-subsection-title">Upcoming Payments</h3>
                    <div id="upcomingPaymentsFields" class="page-field-grid customer-payment-fields"></div>

                    <h3 class="customer-subsection-title">Completed Payments</h3>
                    <div id="completedPaymentsFields" class="page-field-grid customer-payment-fields"></div>
                </section>
            </div>

            <div class="dlg-footer customer-edit-footer">
                <button id="btnSave" class="primary" type="button">Save</button>
                <button id="btnCancel" type="button">Cancel</button>
            </div>
        </section>
    </div>
</main>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button
                    id="helpDialogCloseButton"
                    class="help-dialog-close-button"
                    type="button"
                    aria-label="Close help"
            >
                ×
            </button>
        </div>

        <div id="helpDialogContent" class="help-dialog-content">
            Loading help...
        </div>

        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@25.12.2/build/js/intlTelInput.min.js"></script>
<script type="module" src="../js/pages/customer-edit-page.js"></script>
</body>
</html>
