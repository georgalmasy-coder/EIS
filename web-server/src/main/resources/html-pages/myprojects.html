<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/myprojects.css" />
</head>

<body>
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    ›
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu…</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app">
    <div class="content">
        <header class="topbar">
            <div class="topbar-content">
                <div class="topbar-project" aria-label="Current project">
                    <span class="topbar-project-prefix">Project</span>
                    <span class="topbar-project-separator" aria-hidden="true">/</span>
                    <strong id="projectName" data-topbar="projectName">—</strong>
                </div>

                <div class="topbar-search" role="search" aria-label="Search on page">
                    <input
                            id="topbarSearchInput"
                            class="topbar-search-input"
                            type="search"
                            placeholder="Search projects..."
                            aria-label="Search on page"
                    />

                    <span
                            id="topbarSearchCount"
                            class="topbar-search-count"
                            aria-live="polite"
                            aria-label="Search result count"
                    ></span>

                    <div class="topbar-search-actions" aria-label="Search navigation">
                        <button
                                id="topbarSearchPrevious"
                                class="topbar-search-button"
                                type="button"
                                aria-label="Previous search result"
                                title="Previous"
                                hidden
                        >
                            ↑
                        </button>

                        <button
                                id="topbarSearchNext"
                                class="topbar-search-button"
                                type="button"
                                aria-label="Next search result"
                                title="Next"
                                hidden
                        >
                            ↓
                        </button>
                    </div>

                    <svg class="topbar-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16.2 16.2L21 21"></path>
                    </svg>
                </div>

                <div class="topbar-actions">
                    <button
                            id="topbarHelpButton"
                            class="topbar-help-button"
                            type="button"
                            hidden
                            aria-label="Open help"
                            data-help-title="Help"
                            title="Open help"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18.2A8.2 8.2 0 1 1 12 3.8a8.2 8.2 0 0 1 0 16.4z"></path>
                            <path d="M12 16.75a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3z"></path>
                            <path d="M12.05 5.25c-2.05 0-3.55 1.25-3.8 3.15a.95.95 0 0 0 1.88.25c.13-.96.84-1.55 1.87-1.55 1.13 0 1.9.67 1.9 1.65 0 .82-.42 1.24-1.32 1.88-1.12.8-1.78 1.48-1.78 3.02v.45a.95.95 0 1 0 1.9 0v-.45c0-.68.22-.94 1-1.5 1.04-.74 2.1-1.54 2.1-3.4 0-2.03-1.56-3.5-3.75-3.5z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <section class="panel my-projects-panel" aria-label="My projects">
            <div class="section-header my-projects-header">
                <div>
                    <h1>My Projects</h1>
                    <p class="my-projects-subtitle">
                        Select the project you want to work with.
                    </p>
                </div>
            </div>

            <div id="projectsGrid" class="my-projects-grid" aria-live="polite">
                <div class="empty">Loading projects…</div>
            </div>
        </section>
    </div>
</main>

<script type="module" src="../js/pages/myprojects-page.js"></script>
</body>
</html>
