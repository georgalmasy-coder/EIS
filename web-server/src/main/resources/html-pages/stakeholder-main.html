<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/stakeholder-main.css" />
</head>

<body class="stakeholder-main-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    &rsaquo;
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu...</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app stakeholder-main-app">
    <div class="content stakeholder-main-content">
        <header class="topbar stakeholder-main-topbar">
            <section class="panel meta topbar-meta" aria-label="Header metadata">
                <div class="topbar-meta-content">
                    <div class="topbar-meta-lines">
                        <div class="meta-line">Customer Name: <strong id="customerName">-</strong></div>
                        <div class="meta-line">Project Name: <strong id="projectName">-</strong></div>
                        <div class="meta-line">User Name: <strong id="userName">-</strong></div>
                    </div>

                    <div class="topbar-logo">
                        <img src="../images/EIS-logo.png" alt="EIS logo" class="eis-logo" />
                    </div>
                </div>
            </section>

            <section class="panel status-panel topbar-status-panel" aria-label="Load status">
                <div class="meta-line">Data: <strong id="loadStatus">Idle</strong></div>
            </section>
        </header>

        <section class="page-layout stakeholder-main-layout" aria-label="Stakeholder">
            <div class="stakeholder-main-header-row">
                <div class="workspace-header stakeholder-workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow stakeholder-workspace-eyebrow"></div>
                    <div id="pageHeading" class="workspace-heading stakeholder-workspace-heading"></div>
                    <div id="pageHelpText" class="workspace-helptext stakeholder-workspace-helptext"></div>
                </div>

                <div class="stakeholder-main-header-actions" role="group" aria-label="View actions">
                    <button
                            id="btnAddNew"
                            class="page-icon-button"
                            type="button"
                            aria-label="Add stakeholder"
                            title="Add stakeholder"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"></path>
                        </svg>
                        <span>Add Stakeholder</span>
                    </button>
                </div>
            </div>

            <div class="page-body stakeholder-main-body">
                <div class="table-frame page-frame has-table-footer stakeholder-main-frame" aria-label="Stakeholder list frame">
                    <div class="table-scroll stakeholder-main-scroll" id="tableScroll">
                        <table class="data-table page-table stakeholder-main-table" aria-label="Stakeholder list">
                            <colgroup id="mainColGroup"></colgroup>
                            <thead>
                            <tr id="mainHeaderRow"></tr>
                            </thead>
                            <tbody id="tbody"></tbody>
                        </table>

                        <div class="empty page-empty stakeholder-main-empty" id="emptyState">Loading stakeholders...</div>
                    </div>

                    <div class="data-table-footer stakeholder-main-table-footer" aria-live="polite">
                        <span class="data-table-footer-count" id="stakeholderTableCount">0 of 0</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                &times;
            </button>
        </div>

        <div id="helpDialogContent" class="help-dialog-content">
            Loading help...
        </div>

        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/stakeholder-main-page.js"></script>
</body>
</html>
