<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../../css/common.css" />
    <link rel="stylesheet" href="../../css/app.css" />
    <link rel="stylesheet" href="../../css/menu.css" />
    <link rel="stylesheet" href="../../css/generel.css" />
    <link rel="stylesheet" href="../../css/topbar.css" />
    <link rel="stylesheet" href="../../css/help-dialog.css" />
    <link rel="stylesheet" href="../../css/department-main.css" />
</head>

<body class="department-main-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    &#8250;
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu...</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app department-main-app">
    <div class="content department-main-content">
        <header class="topbar department-main-topbar">
            </header>

        <section class="page-layout department-main-layout" aria-label="Department maintenance">
            <div class="department-main-header-row">
                <div class="workspace-header department-workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow department-workspace-eyebrow"></div>
                    <div id="pageHeading" class="workspace-heading department-workspace-heading"></div>
                    <div id="pageHelpText" class="workspace-helptext department-workspace-helptext"></div>
                </div>

                <div class="department-main-header-actions" role="group" aria-label="Department actions">
                    <button
                            id="btnAddDepartment"
                            class="department-main-icon-button"
                            type="button"
                            aria-label="Create department"
                            title="Create department"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="page-body department-main-body">
                <div class="table-frame page-frame has-table-footer department-main-list-frame" aria-label="Department list frame">
                    <div class="table-scroll department-main-list-scroll" id="tableScroll">
                        <table class="data-table page-table department-main-table" aria-label="Department list">
                            <colgroup id="mainColGroup">
                                <col style="width: 24%;">
                                <col style="width: 61%;">
                                <col style="width: 15%;">
                            </colgroup>
                            <thead>
                            <tr id="mainHeaderRow">
                                <th>Department</th>
                                <th>Description</th>
                                <th class="department-main-active-header">Active</th>
                            </tr>
                            </thead>
                            <tbody id="tbody"></tbody>
                        </table>

                        <div class="empty page-empty department-main-empty" id="listEmptyState">
                            Loading departments...
                        </div>
                    </div>

                    <div class="data-table-footer department-main-table-footer" aria-live="polite">
                        <span class="data-table-footer-count" id="departmentTableCount">0 of 0</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<dialog id="departmentDialog" class="department-main-dialog" aria-labelledby="departmentDialogTitle">
    <form id="departmentForm" method="dialog" class="department-main-dialog-form">
        <div class="page-dialog-head department-main-dialog-head">
            <div class="department-main-dialog-title-group">
                <h3 id="departmentDialogTitle">Department</h3>
            </div>
        </div>

        <div class="department-main-dialog-grid">
            <input type="hidden" id="departmentId" />

            <div class="page-field department-main-wide-field">
                <label for="departmentNameInput">Department kode <span aria-hidden="true">*</span></label>
                <input id="departmentNameInput" type="text" maxlength="10" autocomplete="off" required />
            </div>

            <div class="page-field department-main-wide-field">
                <label for="departmentDescriptionInput">Department description</label>
                <textarea id="departmentDescriptionInput" rows="4" maxlength="255"></textarea>
            </div>

            <div class="page-field checkbox-field department-main-checkbox-field">
                <input id="departmentActiveInput" type="checkbox" checked />
                <label for="departmentActiveInput">Active</label>
            </div>
        </div>

        <div class="dlg-footer department-main-dialog-footer">
            <button id="departmentSaveBtn" class="primary" type="button">Save</button>
            <button id="departmentCancelBtn" type="button">Cancel</button>
        </div>
    </form>
</dialog>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                &times;
            </button>
        </div>

        <div id="helpDialogContent" class="help-dialog-content">
            Loading help...
        </div>

        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../../js/pages/department-main-page.js"></script>
</body>
</html>
