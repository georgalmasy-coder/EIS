<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/basisstakeholderrequirement.css" />
    <link rel="stylesheet" href="../css/basistraceability.css" />
</head>

<body class="traceability-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    ›
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu…</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app traceability-app">
    <div class="content traceability-content">
        <header class="topbar traceability-topbar">
            <section class="panel meta topbar-meta" aria-label="Header metadata">
                <div class="topbar-meta-content">
                    <div class="topbar-meta-lines">
                        <div class="meta-line">Customer Name: <strong id="customerName">—</strong></div>
                        <div class="meta-line">Project Name: <strong id="projectName">—</strong></div>
                        <div class="meta-line">User Name: <strong id="userName">—</strong></div>
                    </div>

                    <div class="topbar-logo">
                        <img src="../images/EIS-logo.png" alt="EIS logo" class="eis-logo" />
                    </div>
                </div>
            </section>

            <section class="panel status-panel topbar-status-panel" aria-label="Load status">
                <div class="meta-line">Data: <strong id="loadStatus">Idle</strong></div>
            </section>
        </header>

        <section class="page-layout traceability-layout" aria-label="Traceability matrix">
            <div class="traceability-header-row">
                <div class="workspace-header traceability-workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow traceability-workspace-eyebrow"></div>
                    <div id="pageHeading" class="workspace-heading traceability-workspace-heading"></div>
                    <div id="pageHelpText" class="workspace-helptext traceability-workspace-helptext"></div>
                </div>
            </div>

            <div class="traceability-info-bar" aria-label="Traceability matrix information">
                <div class="traceability-info-item">
                    <span class="traceability-info-label">Rows:</span>
                    <strong id="traceabilityRowCount">—</strong>
                </div>

                <div class="traceability-info-item">
                    <span class="traceability-info-label">Columns:</span>
                    <strong id="traceabilityColumnCount">—</strong>
                </div>

                <div class="traceability-system-label">
                    <strong id="traceabilityColumnGroupLabel">System Requirement</strong>
                </div>

                <div class="traceability-legend" id="traceabilityLegend" aria-label="Traceability color legend"></div>
            </div>

            <div class="page-body traceability-body">
                <div class="traceability-frame" aria-label="Traceability matrix frame">
                    <div class="traceability-table-scroll" id="traceabilityTableScroll">
                        <table class="traceability-table" aria-label="Traceability matrix">
                            <thead id="traceabilityTableHead"></thead>
                            <tbody id="traceabilityTableBody"></tbody>
                        </table>

                        <div class="traceability-empty is-visible" id="traceabilityEmptyState">
                            Loading traceability matrix…
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div id="traceabilityContextMenu" class="traceability-context-menu" role="menu" aria-hidden="true"></div>

<dialog id="traceabilityRequirementDialog" class="traceability-requirement-dialog" aria-labelledby="traceabilityRequirementDialogTitle">
    <form method="dialog" class="traceability-requirement-dialog-form">
        <div class="traceability-requirement-dialog-head">
            <h3 id="traceabilityRequirementDialogTitle">Traceability Details</h3>
            <button
                    id="traceabilityRequirementDialogCloseButton"
                    class="traceability-requirement-dialog-close-button"
                    type="button"
                    aria-label="Close traceability details"
            >
                ×
            </button>
        </div>

        <div class="traceability-requirement-dialog-content">
            <section class="traceability-requirement-dialog-section" aria-labelledby="traceabilityStakeholderTitle">
                <h4 id="traceabilityStakeholderTitle">Stakeholder Requirement</h4>

                <label class="traceability-dialog-field">
                    <span>ID</span>
                    <input id="traceabilityStakeholderId" type="text" readonly>
                </label>

                <label class="traceability-dialog-field">
                    <span>Name</span>
                    <input id="traceabilityStakeholderName" type="text" readonly>
                </label>

                <label class="traceability-dialog-field">
                    <span>Description</span>
                    <textarea id="traceabilityStakeholderDescription" readonly></textarea>
                </label>
            </section>

            <section class="traceability-requirement-dialog-section" aria-labelledby="traceabilitySystemTitle">
                <h4 id="traceabilitySystemTitle">System Requirement</h4>

                <label class="traceability-dialog-field">
                    <span>ID</span>
                    <input id="traceabilitySystemId" type="text" readonly>
                </label>

                <label class="traceability-dialog-field">
                    <span>Name</span>
                    <input id="traceabilitySystemName" type="text" readonly>
                </label>

                <label class="traceability-dialog-field">
                    <span>Description</span>
                    <textarea id="traceabilitySystemDescription" readonly></textarea>
                </label>
            </section>
        </div>

        <div class="traceability-requirement-dialog-footer">
            <button id="traceabilityRequirementDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                ×
            </button>
        </div>

        <div id="helpDialogContent" class="help-dialog-content">
            Loading help…
        </div>

        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/basistraceability-page.js"></script>
</body>
</html>
