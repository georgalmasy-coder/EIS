<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/allprojects.css" />
</head>

<body class="all-projects-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    ›
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu…</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app all-projects-app">
    <div class="content all-projects-content">
        <header class="topbar all-projects-topbar">
            <div class="topbar-actions">
                <button
                        id="topbarHelpButton"
                        class="topbar-help-button"
                        type="button"
                        hidden
                        aria-label="Open help"
                        data-help-page="myprojects"
                        data-help-title="Help"
                        title="Open help"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18.2A8.2 8.2 0 1 1 12 3.8a8.2 8.2 0 0 1 0 16.4z"></path>
                        <path d="M12 16.75a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3z"></path>
                        <path d="M12.05 5.25c-2.05 0-3.55 1.25-3.8 3.15a.95.95 0 0 0 1.88.25c.13-.96.84-1.55 1.87-1.55 1.13 0 1.9.67 1.9 1.65 0 .82-.42 1.24-1.32 1.88-1.12.8-1.78 1.48-1.78 3.02v.45a.95.95 0 1 0 1.9 0v-.45c0-.68.22-.94 1-1.5 1.04-.74 2.1-1.54 2.1-3.4 0-2.03-1.56-3.5-3.75-3.5z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <section class="page-layout all-projects-layout" aria-label="All Projects">
            <div class="all-projects-header-row">
                <div class="workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow">PORTFOLIO</div>
                    <div id="pageHeading" class="workspace-heading">Projects</div>
                    <div id="pageHelpText" class="workspace-helptext">Choose a project or continue the work that needs attention.</div>
                </div>
                
                <div class="all-projects-actions">
                    <button id="btnNewProject" class="new-project-button">
                        <span class="plus-icon">+</span> New project
                    </button>
                </div>
            </div>

            <div class="all-projects-toolbar">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16.2 16.2L21 21"></path>
                    </svg>
                    <input type="text" id="projectSearch" placeholder="Search projects..." />
                </div>
                
                <div class="filter-tabs">
                    <button class="filter-tab is-active" data-filter="active">Active <span class="count" id="countActive">0</span></button>
                    <button class="filter-tab" data-filter="needs-attention">Needs attention <span class="count" id="countNeedsAttention">0</span></button>
                    <button class="filter-tab" data-filter="archived">Archived</button>
                </div>
            </div>

            <div id="projectsList" class="projects-list-container">
                <div class="loading-message">Loading projects...</div>
            </div>
            
            <footer class="all-projects-footer">
                <div id="projectCountText" class="project-count-info">0 active projects</div>
                <div class="footer-note">Project model details are shown after opening a project.</div>
            </footer>
        </section>
    </div>
</main>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                ×
            </button>
        </div>

        <div id="helpDialogContent" class="help-dialog-content">
            Loading help…
        </div>

        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/allprojects-page.js"></script>
</body>
</html>
