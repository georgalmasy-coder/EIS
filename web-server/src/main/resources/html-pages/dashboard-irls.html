<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>{{title}}</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/tabs-list.css" />
    <link rel="stylesheet" href="../css/generel.css" />
    <link rel="stylesheet" href="../css/topbar.css" />
    <link rel="stylesheet" href="../css/help-dialog.css" />
    <link rel="stylesheet" href="../css/dashboard-irls.css" />
</head>

<body class="dashboard-irls-document">
<button
        id="menuToggle"
        class="menu-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="sideMenu"
        aria-expanded="false"
>
    >
</button>

<div id="leftHoverZone" class="left-hover-zone" aria-hidden="true"></div>

<nav id="sideMenu" class="side-menu" aria-label="Side menu">
    <h2>Menu</h2>
    <div id="menuStatus" class="menu-status">Loading menu...</div>
    <ul id="menuRoot" class="menu-root" aria-label="Menu root"></ul>
</nav>

<main class="app dashboard-irls-app">
    <div class="content dashboard-irls-content">
        <header class="topbar dashboard-irls-topbar">
            </header>

        <section class="page-layout dashboard-irls-layout" aria-label="Dashboard IRL matrix">
            <div class="dashboard-irls-header-row">
                <div class="workspace-header dashboard-irls-workspace-header" aria-label="Workspace information">
                    <div id="pageEyebrow" class="workspace-eyebrow dashboard-irls-workspace-eyebrow"></div>
                    <div id="pageHeading" class="workspace-heading dashboard-irls-workspace-heading"></div>
                    <div id="pageHelpText" class="workspace-helptext dashboard-irls-workspace-helptext"></div>
                </div>

                <div class="dashboard-irls-actions" aria-label="Page actions">
                    <button
                            id="btnDownloadPdf"
                            class="dashboard-irls-icon-button dashboard-irls-pdf-button"
                            type="button"
                            aria-label="Download dashboard as PDF"
                            title="Download dashboard as PDF"
                    >
                        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                            <path d="M8 3.5h11.5L25 9v19.5H8V3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                            <path d="M19.5 3.5V9H25" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                            <rect x="6" y="15" width="20" height="9" rx="1.6" fill="currentColor"></rect>
                            <text x="16" y="21.7" text-anchor="middle" font-size="6.4" font-weight="800" fill="rgb(15,23,42)">PDF</text>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="dashboard-irls-info-bar" aria-label="Dashboard IRL information">
                <div class="dashboard-irls-info-item">
                    <span class="dashboard-irls-info-label">Number of Physical Structure:</span>
                    <strong id="dashboardIrlStructureCount">-</strong>
                </div>

                <label class="dashboard-irls-filter-toggle">
                    <input id="dashboardIrlOverdueOnlyToggle" type="checkbox" />
                    <span>Show overdue only</span>
                </label>

                <label class="dashboard-irls-filter-toggle">
                    <input id="dashboardIrlNotOverdueOnlyToggle" type="checkbox" />
                    <span>Show not overdue only</span>
                </label>

                <div class="dashboard-irls-trl-filter-inline" aria-label="TRL filter">
                    <span class="dashboard-irls-trl-filter-inline-label">TRL:</span>
                    <div id="dashboardIrlTrlFilterList" class="dashboard-irls-trl-filter-inline-list"></div>
                </div>
            </div>

            <div class="page-body dashboard-irls-body">
                <div class="table-frame page-frame has-table-footer dashboard-irls-frame" aria-label="Dashboard IRL frame">
                    <div class="table-scroll dashboard-irls-table-scroll" id="dashboardIrlTableScroll">
                        <table class="data-table page-table dashboard-irls-table" aria-label="Dashboard IRL">
                            <thead id="dashboardIrlTableHead"></thead>
                            <tbody id="dashboardIrlTableBody"></tbody>
                        </table>

                        <div class="dashboard-irls-empty is-visible" id="dashboardIrlEmptyState">
                            Loading dashboard IRL...
                        </div>
                    </div>
                    <div class="data-table-footer dashboard-irls-table-footer" aria-live="polite">
                        <span class="data-table-footer-count" id="dashboardIrlTableCount">0 of 0</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<dialog id="helpDialog" class="help-dialog" aria-labelledby="helpDialogTitle">
    <form method="dialog" class="help-dialog-form">
        <div class="help-dialog-head">
            <h3 id="helpDialogTitle">Help</h3>
            <button id="helpDialogCloseButton" class="help-dialog-close-button" type="button" aria-label="Close help">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"></path>
                </svg>
            </button>
        </div>
        <div id="helpDialogContent" class="help-dialog-content"></div>
        <div class="help-dialog-footer">
            <button id="helpDialogOkButton" class="primary" type="button">Close</button>
        </div>
    </form>
</dialog>

<script type="module" src="../js/pages/dashboard-irls-page.js"></script>
<script src="../js/tabs-list.js"></script>
</body>
</html>
