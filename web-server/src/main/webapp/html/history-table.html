<div class="table-frame history-table-frame">
    <div class="table-scroll">
        <table class="data-table history-table" aria-label="History table">
            <thead>
            <tr>
                <th data-key="changedDateTime">
                    <span class="sort">Changed <span class="sort-indicator" data-history-sort-indicator="changedDateTime"></span></span>
                </th>
                <th data-key="changedByUserId">
                    <span class="sort">Changed By <span class="sort-indicator" data-history-sort-indicator="changedByUserId"></span></span>
                </th>
                <th data-key="version">
                    <span class="sort">Version <span class="sort-indicator" data-history-sort-indicator="version"></span></span>
                </th>
            </tr>
            </thead>
            <tbody data-history-body></tbody>
        </table>
        <div class="empty history-table-empty" data-history-empty>No history rows.</div>
    </div>
</div>
