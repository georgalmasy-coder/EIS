<header class="topbar" data-component="topbar">
    <section class="topbar-shell" aria-label="Header">
        <div class="topbar-left">
            <div id="topPanelTitle" class="topbar-title" data-topbar="topPanelTitle"></div>
        </div>

        <div class="topbar-center">
            <div class="topbar-search" role="search" aria-label="Find på siden">
                <span class="topbar-search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
                        <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                </span>

                <input
                    id="topbarSearchInput"
                    class="topbar-search-input"
                    type="text"
                    inputmode="search"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    placeholder="Search requirements, structures or commands..."
                    aria-label="Search on page"
                />

                <div class="topbar-search-actions" aria-label="Search navigation">
                    <span
                        id="topbarSearchCount"
                        class="topbar-search-count"
                        aria-live="polite"
                        aria-label="Search result count"
                    ></span>

                    <button
                        id="topbarSearchPrevious"
                        class="topbar-search-button"
                        type="button"
                        aria-label="Previous search result"
                        title="Previous"
                        hidden
                    >
                        ↑
                    </button>

                    <button
                        id="topbarSearchNext"
                        class="topbar-search-button"
                        type="button"
                        aria-label="Next search result"
                        title="Next"
                        hidden
                    >
                        ↓
                    </button>
                </div>
            </div>
        </div>

        <div class="topbar-right">
            <button
                id="topbarHelpButton"
                class="topbar-help-button"
                type="button"
                aria-label="Open help"
                title="Help"
                hidden
            >
                ?
            </button>
        </div>
    </section>

    <section class="panel status-panel topbar-status-panel" aria-label="Load status">
        <div class="meta-line">Data: <strong data-topbar="loadStatus">Idle</strong></div>
    </section>
</header>
