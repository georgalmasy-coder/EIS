<header class="topbar" data-component="topbar">
    <section class="panel meta topbar-meta" aria-label="Header metadata">
        <div class="topbar-meta-content">
            <div class="topbar-meta-lines">
                <div class="meta-line"><span id="customerNameLabel" data-topbar-label="customerName"></span>: <strong id="customerName" data-topbar="customerName">—</strong></div>
                <div class="meta-line"><span id="projectNameLabel" data-topbar-label="projectName"></span>: <strong id="projectName" data-topbar="projectName">—</strong></div>
                <div class="meta-line"><span id="userNameLabel" data-topbar-label="userName"></span>: <strong id="userName" data-topbar="userName">—</strong></div>
            </div>

            <div class="topbar-search" role="search" aria-label="Find på siden">
                <input
                        id="topbarSearchInput"
                        class="topbar-search-input"
                        type="search"
                        placeholder="What are you looking for?"
                        aria-label="Search on page"
                />

                <span
                        id="topbarSearchCount"
                        class="topbar-search-count"
                        aria-live="polite"
                        aria-label="Search result count"
                ></span>

                <div class="topbar-search-actions" aria-label="Search navigation">
                    <button
                            id="topbarSearchPrevious"
                            class="topbar-search-button"
                            type="button"
                            aria-label="Previous search result"
                            title="Previous"
                            hidden
                    >
                        ↑
                    </button>

                    <button
                            id="topbarSearchNext"
                            class="topbar-search-button"
                            type="button"
                            aria-label="Next search result"
                            title="Next"
                            hidden
                    >
                        ↓
                    </button>
                </div>

                <span class="topbar-search-icon" aria-hidden="true">⌕</span>
            </div>

            <div class="topbar-logo">
                <img src="../images/EIS-logo.png" alt="EIS logo" class="eis-logo" data-topbar="logo" />
            </div>
        </div>
    </section>

    <section class="panel status-panel topbar-status-panel" aria-label="Load status">
        <div class="meta-line">Data: <strong data-topbar="loadStatus">Idle</strong></div>
    </section>
</header>
