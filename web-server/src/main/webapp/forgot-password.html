<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Forgot password | BEPA EIS</title>
    <link rel="stylesheet" href="css/password-reset.css">
</head>
<body>
<header class="site-header"><div class="header-inner">
    <a class="logo" href="index.html">BEPA EIS</a>
    <a href="index.html">Back to front page</a>
</div></header>
<main>
    <p class="eyebrow">Account access</p>
    <h1>Forgot password?</h1>
    <p class="description">Enter the email address you use to log in. We will email you a link to choose a new password.</p>
    <form id="requestForm">
        <label for="email">Email address
            <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required autofocus>
        </label>
        <button id="submitBtn" type="submit">Send reset link</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <a class="back-link" href="index.html#login">Back to login</a>
    <noscript><p>Enable JavaScript to request a password reset link.</p></noscript>
</main>
<script type="module" src="js/pages/forgot-password-page.js"></script>
</body>
</html>
