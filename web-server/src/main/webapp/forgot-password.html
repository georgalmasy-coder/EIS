<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f6f7f8; color: #1f2937; }
        main { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; padding: 24px; }
        form { display: grid; gap: 12px; }
        label { display: grid; gap: 6px; }
        input, button { font: inherit; padding: 10px 12px; }
        button { cursor: pointer; }
        .status { min-height: 1.25em; }
        .error { color: #b91c1c; }
        .ok { color: #166534; }
    </style>
</head>
<body>
<main>
    <h1>Reset password</h1>
    <p>Use the link from email to set a new password.</p>

    <form id="resetForm" novalidate>
        <label>
            Token
            <input id="token" name="token" type="text" autocomplete="off" required />
        </label>

        <label>
            New password
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" />
        </label>

        <label>
            Confirm password
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" />
        </label>

        <button type="submit" id="submitBtn">Update password</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>

    <p><a href="login.html">Back to login</a></p>
</main>

<script type="module" src="js/pages/forgot-password-page.js"></script>
</body>
</html>
