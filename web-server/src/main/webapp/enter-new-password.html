<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Enter new password | BEPA EIS</title>
    <link rel="stylesheet" href="css/password-reset.css">
</head>
<body>
<header class="site-header"><div class="header-inner">
    <a class="logo" href="index.html">BEPA EIS</a>
    <a href="index.html">Back to front page</a>
</div></header>
<main>
    <p class="eyebrow">Account access</p>
    <h1>Enter new password</h1>
    <p class="description">Choose a new password for your EIS account. After saving, log in with your new password.</p>
    <form id="resetForm" hidden>
        <label for="newPassword">New password
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="passwordHelp">
        </label>
        <p id="passwordHelp" class="help">Use 8–128 characters. A long, unique password is recommended.</p>
        <label for="confirmPassword">Confirm new password
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>
        <button id="submitBtn" type="submit" disabled>Save new password</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite">Checking your reset link…</p>
    <a id="loginLink" class="button-link" href="index.html#login" hidden>Log in with your new password</a>
    <a id="requestLink" class="back-link" href="forgot-password.html" hidden>Request a new reset link</a>
    <noscript><p>Enable JavaScript to reset your password.</p></noscript>
</main>
<script type="module" src="js/pages/enter-new-password-page.js"></script>
</body>
</html>
