<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>På hylden</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            opacity: 0;
            animation: fadeIn 5s ease-in forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<img src="images/EIS-PAA-HYLDEN.png" alt="På hylden">
</body>
</html>
