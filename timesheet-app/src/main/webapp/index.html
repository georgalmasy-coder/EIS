<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EIS Time Registration</title>
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <img src="assets/img/eis-tech-small.png" alt="EIS Tech" class="brand-mark">
        <div>
            <div class="brand-title">EIS Time Registration</div>
            <div class="brand-subtitle" id="selectedCustomerLabel">No customer selected</div>
        </div>
    </div>
    <div class="topbar-actions">
        <label class="customer-switcher">
            <span>Customer</span>
            <select id="customerSelect"></select>
        </label>
        <button type="button" class="icon-button" id="refreshButton" title="Refresh">
            <span class="icon" data-icon="refresh"></span>
        </button>
    </div>
</header>

<main class="shell">
    <nav class="sidebar">
        <button class="nav-item active" data-view="dashboard">Overview</button>
        <button class="nav-item" data-view="customers">Customers</button>
        <button class="nav-item" data-view="activities">Activities</button>
        <button class="nav-item" data-view="time">Time entries</button>
        <button class="nav-item" data-view="materials">Materials</button>
        <button class="nav-item" data-view="invoicing">Invoicing</button>
    </nav>

    <section class="content">
        <div id="statusBanner" class="banner hidden"></div>
        <div id="viewRoot"></div>
    </section>
</main>

<dialog id="entryDialog" class="dialog">
    <form method="dialog" class="dialog-frame">
        <header class="dialog-head">
            <div>
                <div class="dialog-title" id="dialogDateTitle">Entries</div>
                <div class="dialog-subtitle" id="dialogDateMeta"></div>
            </div>
            <button class="icon-button" value="cancel" title="Close">
                <span class="icon" data-icon="close"></span>
            </button>
        </header>

        <div id="dialogEntries"></div>
        <div id="dialogFormSlot"></div>
    </form>
</dialog>

<dialog id="promptDialog" class="dialog">
    <div class="dialog-frame">
        <header class="dialog-head">
            <div>
                <div class="dialog-title" id="promptTitle">Editing</div>
                <div class="dialog-subtitle" id="promptSubtitle"></div>
            </div>
            <button class="icon-button" type="button" id="promptClose" title="Close">
                <span class="icon" data-icon="close"></span>
            </button>
        </header>
        <div id="promptBody"></div>
    </div>
</dialog>

<script src="assets/js/app.js" defer></script>
</body>
</html>
